<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Můj jídelníček</title>
<style>
:root{--bg:#f1f6f1;--card:#fff;--ink:#1d2b24;--mut:#64766c;--g:#2fa466;--g2:#e1f4e9;--g3:#1d7a4a;--warn:#d4601c;--warn2:#fff0e2;--bad:#c62f2f;--line:#e2eae4;--gold:#f5b324;--shadow:0 6px 22px rgba(30,90,60,.09);--hero:linear-gradient(135deg,#2fb673 0%,#1f9a73 50%,#2a85a8 100%)}
@media(prefers-color-scheme:dark){:root{--bg:#101814;--card:#1a2620;--ink:#e8f2ec;--mut:#9bb1a5;--g:#46c887;--g2:#21392c;--g3:#86e3b1;--warn:#ff9d5c;--warn2:#3a2b1e;--bad:#ff8080;--line:#2a3b33;--shadow:0 6px 22px rgba(0,0,0,.4);--hero:linear-gradient(135deg,#1c6c4a,#176058 55%,#1a5069)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:8;background:var(--card);box-shadow:0 2px 14px rgba(0,0,0,.07);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:8px;color:var(--g3)}.brand i{font-style:normal;font-size:1.6rem}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:transparent;border:0;color:var(--mut);font:inherit;font-size:.95rem;padding:8px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:6px}
nav button i{font-style:normal;font-size:1.15rem}nav button.on{background:var(--g2);color:var(--g3);font-weight:700}
main{max-width:980px;margin:0 auto;padding:16px 14px 100px}
.card{background:var(--card);border-radius:22px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
h2{margin:.1em 0 .5em;font-size:1.45rem}h3{margin:.1em 0 .5em;font-size:1.08rem}
.muted{color:var(--mut);font-size:.9rem}
button.b,label.b{display:inline-block;background:linear-gradient(180deg,var(--g),var(--g3));color:#fff;border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .08s,filter .15s}
button.b:hover,label.b:hover{filter:brightness(1.06)}button.b:active{transform:translateY(2px);box-shadow:none}
button.b.s,label.b.s{background:var(--g2);color:var(--g3);box-shadow:none}button.b.w{background:var(--warn2);color:var(--warn);box-shadow:none}button.b.x{background:transparent;color:var(--bad);border:1.5px solid var(--line);box-shadow:none}
button.b.sm{padding:6px 12px;font-size:.88rem;border-radius:11px}button.b.big{width:100%;padding:14px;font-size:1.05rem;margin-top:10px}button.b:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.form label{display:block;font-size:.9rem;color:var(--mut)}.form input,.form select{width:100%;margin-top:3px}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),#7ee0a6);border-radius:9px;transition:width .6s}.bar i.over{background:linear-gradient(90deg,var(--warn),#ffb27a)}.bar.thin{height:8px}
/* hero */
.hero{background:var(--hero);color:#fff;border-radius:26px;padding:18px 18px 14px;margin-bottom:14px;box-shadow:0 10px 28px rgba(31,140,100,.32);animation:rise .4s ease both}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}.hello{font-size:1.45rem;font-weight:800}.hero .sub{opacity:.9;font-size:.95rem}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.22);padding:4px 12px;border-radius:20px;font-weight:700;font-size:.9rem}
.hero-main{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center;margin:12px 0}
.ring{position:relative;width:170px;height:170px;flex:none}.ring svg{width:100%;height:100%}
.ring .rt{fill:none;stroke:rgba(255,255,255,.25);stroke-width:14}.ring .rp{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .8s}.ring .rp.over{stroke:#ffd0a8}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.rc b{font-size:2.3rem;line-height:1}.rc span{font-size:.8rem;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-width:230px}.tile{background:rgba(255,255,255,.18);border-radius:16px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}.tile i{font-style:normal;font-size:1.4rem}.tile b{font-size:1.1rem}.tile span{font-size:.75rem;opacity:.9}
.xp{display:flex;align-items:center;gap:10px;font-size:.8rem}.xp .bar{flex:1;background:rgba(255,255,255,.25)}.xp .bar i{background:#fff}
/* trenér */
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}.mascot{width:52px;height:52px;border-radius:50%;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:2rem;flex:none;box-shadow:var(--shadow)}
.bubble{background:var(--card);border-radius:20px 20px 20px 6px;padding:12px 16px;box-shadow:var(--shadow);font-weight:600}
/* cesta */
.track{position:relative;height:16px;background:var(--line);border-radius:10px;margin:38px 8px 26px}.track .fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--g),#8be3ad);transition:width .8s}
.runner{position:absolute;top:-30px;transform:translateX(-50%);font-size:1.6rem;transition:left .8s}.flag{position:absolute;right:-6px;top:-30px;font-size:1.5rem}
.ms{position:absolute;top:20px;transform:translateX(-50%);font-size:.7rem;color:var(--mut)}.ms.on{color:var(--g);font-weight:700}
.jrow{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;color:var(--mut)}.jrow b{font-size:1.4rem;color:var(--ink)}.jmsg{margin:8px 0 0}
/* mise */
.mi{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.mi:first-of-type{border-top:0}.mi .ck{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;font-size:.95rem}.mi.ok .ck{background:var(--g);border-color:var(--g);color:#fff;animation:pop .35s}.mi .mt{flex:1}.mi .bar{margin-top:5px;height:7px}
/* jídla */
.meal{border-left:6px solid var(--line)}.meal.done{border-left-color:var(--g);background:linear-gradient(0deg,var(--card),var(--card)),var(--g2)}
.mhead{display:flex;gap:12px;align-items:center}.mic{width:50px;height:50px;border-radius:16px;background:var(--g2);display:flex;align-items:center;justify-content:center;font-size:1.7rem;flex:none}.done .mic{background:var(--g);animation:pop .35s}
.slot{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700}.mname{font-size:1.05rem;margin:.1em 0;font-weight:600}
.opts{margin-top:8px}.opts summary{cursor:pointer;color:var(--mut);font-size:.9rem}.opts .row{margin-top:8px}
.chip{display:inline-block;background:var(--g2);color:var(--g3);border-radius:12px;padding:2px 10px;margin:2px 3px 2px 0;font-size:.82rem}
.soy{background:var(--warn2);color:var(--warn);border-radius:12px;padding:1px 10px;font-size:.82rem;font-weight:700}.nosoy{background:var(--g2);color:var(--g3);border-radius:12px;padding:1px 10px;font-size:.82rem;font-weight:700}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.cup{width:28px;height:34px;border:2.5px solid #6fb1da;border-radius:4px 4px 10px 10px;background:transparent;transition:background .3s}.cup.f{background:linear-gradient(180deg,#9fd2f0,#5aa8dc)}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.day.today{outline:3px solid var(--g)}.day ul{padding-left:18px;margin:6px 0;font-size:.9rem}
.daynav{justify-content:space-between;margin-bottom:10px}.daynav b{font-size:1.1rem}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:20px;z-index:30;overflow:auto}#modal.on{display:flex}#modal .box{background:var(--card);border-radius:22px;padding:18px;max-width:640px;width:100%}
.pick{display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 2px;cursor:pointer}.pick:hover{background:var(--g2)}
.shop li{list-style:none;padding:5px 0}.shop ul{padding:0;margin:0 0 8px}.shop .ck{text-decoration:line-through;color:var(--mut)}.shop input{width:20px;height:20px;vertical-align:middle;margin-right:8px}.shop h4{margin:10px 0 2px;color:var(--g3)}
.tip{background:var(--g2);border-radius:16px;padding:11px 15px;margin-bottom:14px}
.hide{display:none}
/* odznaky */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px}.bdg{background:var(--g2);border-radius:18px;padding:12px 8px;text-align:center}.bdg i{font-style:normal;font-size:2rem;display:block}.bdg b{display:block;font-size:.9rem}.bdg span{font-size:.75rem;color:var(--mut)}
.bdg.lock{background:var(--line);filter:grayscale(1);opacity:.55}
#toasts{position:fixed;right:12px;bottom:84px;z-index:40;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:#23302a;color:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 22px #0005;animation:rise .3s}.toast.bd{background:linear-gradient(135deg,#d99a0b,#f5b324);color:#2b1c00}.toast button{margin-top:6px}
.al{border-left:5px solid #e0b252;background:var(--warn2);padding:8px 12px;margin:6px 0;border-radius:10px;font-size:.95rem}.al.i{border-color:#6aa8d6;background:var(--g2)}
details summary{cursor:pointer;color:var(--g3);font-weight:600;margin:4px 0}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
@media(max-width:760px){header{padding:8px 14px}nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--card);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.12);z-index:20}nav button{flex-direction:column;gap:0;font-size:.68rem;padding:4px 6px;flex:1}nav button i{font-size:1.45rem}.hero-main{justify-content:center}#toasts{bottom:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{header,nav,.noprint,button,.coach,.hero{display:none!important}body{background:#fff;color:#000}.card{box-shadow:none;border:1px solid #ccc;animation:none}}
</style>

  <div class="brand"><i>🥑</i><span>Můj jídelníček</span></div>

<div id="modal"><div class="box" id="mbox"></div></div>

<script>
"use strict";
/* ============ DATA: recepty z Vašeho jídelníčku (kcal a bílkoviny jsou orientační odhad) ============ */
const SL=[['sn','Snídaně'],['ds','Dopolední svačina'],['ob','Oběd'],['os','Odpolední svačina'],['ve','Večeře'],['v2','II. večeře']];
/* kategorie a jednotka surovin: M maso/ryby, D mléčné/vejce, P pečivo/obiloviny, Z zelenina, O ovoce, L luštěniny/ořechy, X ostatní */
const CAT={M:'Maso a ryby',D:'Mléčné výrobky a vejce',P:'Pečivo a obiloviny',Z:'Zelenina',O:'Ovoce',L:'Luštěniny, ořechy, semínka',X:'Ostatní'};
const ING={
'Kuřecí maso':'M','Krůtí maso':'M','Krůtí šunka':'M','Šunka':'M','Vepřová panenka':'M','Hovězí maso':'M','Mleté maso':'M','Králík':'M','Krůtí stehno':'M','Losos':'M','Pstruh':'M','Tuňák':'M','Sumeček africký':'M','Rybí filé':'M',
'Ricotta':'D','Tvaroh':'D','Bílý jogurt':'D','Ovocný jogurt':'D','Ovocný tvaroh':'D','Cottage':'D','Lučina':'D','Tvrdý sýr':'D','Plátkový sýr':'D','Mozzarella':'D','Feta':'D','Zakysaná smetana':'D','Pomazánkové máslo':'D','Kefír':'D/ml','Mléko':'D/ml','Vejce':'D/ks',

'Rajče':'Z','Paprika':'Z','Okurka':'Z','Mrkev':'Z','Pórek':'Z','Ředkvičky':'Z','Salát':'Z','Ledový salát':'Z','Špenát':'Z','Brokolice':'Z','Květák':'Z','Cuketa':'Z','Zelené fazolky':'Z','Hrášek':'Z','Celer':'Z','Kedlubna':'Z','Zelí':'Z','Cibule':'Z','Česnek':'Z','Žampiony':'Z','Hlíva ústřičná':'Z','Fenykl':'Z','Dýně':'Z','Červená řepa':'Z','Rukola':'Z','Brambory':'Z','Bílá ředkev':'Z','Zelenina':'Z','Bylinky':'Z','Zelný salát':'Z','Kukuřice':'Z',

'Med':'X','Olivový olej':'X','Hořčice':'X','Javorový sirup':'X','Jablečné pyré':'X'
};
const R=[];
function r(s,n,k,p,ing,soy){const i=R.filter(x=>x.s===s).length+1;R.push({id:s+i,s,n,k,p,ing,soy:soy||0});}
/* soy: 0 bez sóji, 1 obsahuje sóju, 2 může obsahovat sóju (hlídat složení) */
// Snídaně
r('sn','Pomazánka z ricotty 80 g s pažitkou, žitný chléb 60 g, salát a rajče',280,14,'Ricotta 80,Žitný chléb 60,Salát 20,Rajče 80,Bylinky 5');

r('sn','Celozrnný toust 50 g zapečený se šunkou 30 g a sýrem 30 g, pórek, rajčata',340,22,'Celozrnný toustový chléb 50,Šunka 30,Tvrdý sýr 30,Pórek 40,Rajče 80');

r('sn','Lučina 70 g, špaldový chléb 60 g, ředkvičky',320,14,'Lučina 70,Špaldový chléb 60,Ředkvičky 60');
r('sn','Tuňáková pomazánka s pórkem a hořčicí (50 g tuňáka, lžíce tvarohu), špaldový chléb 60 g, okurka',270,20,'Tuňák 50,Tvaroh 20,Pórek 30,Hořčice 5,Špaldový chléb 60,Okurka 80');
r('sn','Vejce naměkko, celozrnný chléb 60 g, sýr 30 g, mrkev',340,20,'Vejce 1,Celozrnný chléb 60,Plátkový sýr 30,Mrkev 80');
r('sn','Ovocný tvarohový koláč z celozrnné špaldové mouky 100 g, kefír 200 ml',360,14,'Celozrnná špaldová mouka 60,Tvaroh 60,Ovoce 80,Kefír 200');
r('sn','Krůtí šunka 30 g a plátkový sýr 30 g na špaldovém chlebu 60 g, ledový salát',330,23,'Krůtí šunka 30,Plátkový sýr 30,Špaldový chléb 60,Ledový salát 30');
r('sn','Volské oko s kari na plátku šunky 30 g, kváskový chléb 60 g, bílá ředkev',340,20,'Vejce 1,Šunka 30,Kváskový chléb 60,Bílá ředkev 60');
r('sn','Lučina 40 g a šunka 30 g, kváskový chléb 50 g, paprika',300,17,'Lučina 40,Šunka 30,Kváskový chléb 50,Paprika 80');
r('sn','Lučinová pomazánka s vejcem (50 g Lučiny, půl vejce, hořčice, pažitka), špaldový rohlík 60 g, kedlubna',300,17,'Lučina 50,Vejce 1,Hořčice 5,Bylinky 5,Špaldový rohlík 60,Kedlubna 80');

r('sn','Pohanková kaše (30 g pohanky, mléko, lžíce rozinek, lžíce mandlí, javorový sirup nebo strouhané jablko)',330,11,'Pohanka 30,Mléko 150,Rozinky 10,Mandle 10,Jablko 100');

// Dopolední svačina
r('ds','Bílý jogurt 80 g, čerstvé ovoce 150 g',130,5,'Bílý jogurt 80,Ovoce 150');
r('ds','Ovocný tvaroh 130 g',145,8,'Ovocný tvaroh 130');
r('ds','Bílý tvaroh 50 g, čerstvé ovoce 150 g',130,7,'Tvaroh 50,Ovoce 150');
r('ds','Strouhané jablko s mrkví a kousky ananasu (cca 200 g)',100,1,'Jablko 100,Mrkev 60,Ananas 40');
r('ds','Čerstvé ovoce, jeden kus nebo kousky různých druhů (cca 200 g)',100,1,'Ovoce 200');
r('ds','Jablečné pyré nedoslazené 150 ml, hrst mandlí',190,5,'Jablečné pyré 150,Mandle 20');
r('ds','Čerstvé ovoce 150 g se sýrem Ricotta nebo Cottage 60 g',150,8,'Ovoce 150,Ricotta 60');
r('ds','Sušené ovoce s ořechy (cca 40 g)',190,4,'Sušené ovoce 25,Ořechy 15');
r('ds','Půlka jablka 120 g, plátek tvrdého sýra 50 g',190,12,'Jablko 120,Tvrdý sýr 50');
r('ds','Kefírové mléko 250 ml',160,8,'Kefír 250');
r('ds','Ovocný jogurt 160 g',150,6,'Ovocný jogurt 160');
r('ds','Míchaný ovocný salát s pomerančovou šťávou (do 200 g)',110,2,'Ovoce 150,Pomeranč 50');
r('ds','Čerstvé jahody 150 g se lžící zakysané smetany light 50 g',110,3,'Jahody 150,Zakysaná smetana 50');
r('ds','Proteinová tyčinka (cca 40 g) - pozor, často obsahuje sóju',160,12,'Proteinová tyčinka 1',2);
// Oběd
r('ob','Rizoto s kuřecím masem 120 g (rýže natural 50 g, hrášek 50 g), rajčatový salát 100 g',480,35,'Kuřecí maso 120,Rýže natural 50,Hrášek 50,Rajče 100');

function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j){const d=defaults();return Object.assign(d,j,{pf:Object.assign(d.pf,j.pf),set:Object.assign(d.set,j.set)});}}catch(e){}return defaults();}

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const TODAY=()=>iso(new Date());
const DN=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const fmt=s=>{const d=parse(s);return DN[d.getDay()]+' '+d.getDate()+'. '+(d.getMonth()+1)+'.';};
const fmtS=s=>{const d=parse(s);return d.getDate()+'. '+(d.getMonth()+1)+'.';};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};

function curW(){const l=S.wt.length?S.wt[S.wt.length-1].w:+S.pf.w;return l||0;}
function bmr(){const p=S.pf,w=curW();if(!w||!+p.h||!+p.age||!p.sex)return 0;return 10*w+6.25*(+p.h)-5*(+p.age)+(p.sex==='m'?5:-161);}
function target(){
  if(+S.pf.kcal>0)return Math.round(+S.pf.kcal);
  const b=bmr();if(!b)return 1500;
  const floor=S.pf.sex==='m'?1500:1200;
  return Math.max(floor,Math.round((b*(+S.pf.act||1.375)-(+S.set.deficit||500))/10)*10);
}
function activeSlots(){return SL.map(x=>x[0]).filter(s=>s==='sn'||s==='ob'||s==='ve'||S.set[s]);}
function slotName(s){return SL.find(x=>x[0]===s)[1];}
function waterGoal(){const w=curW()||80;return clamp(Math.round(w*0.03/0.25),6,14);}

/* ============ GENERÁTOR ============ */
function allowedGen(x){return S.set.soy==='any'?true:!x.soy;}
function allowedPick(x){return S.set.soy==='strict'?!x.soy:true;}
function pool(s){return R.filter(x=>x.s===s&&!S.ban.includes(x.id)&&allowedGen(x)&&!hasNo(x));}
function recentIds(date){const set=new Set();for(let i=-4;i<=4;i++){if(!i)continue;const d=S.plan[addD(date,i)];if(d)Object.values(d.m).forEach(id=>set.add(id));}return set;}
function calcF(day){const sum=activeSlots().reduce((a,s)=>a+(RB[day.m[s]]?RB[day.m[s]].k:0),0);day.f=sum?clamp(Math.round(target()/sum*20)/20,0.75,1.5):1;}
function genDay(date){
  const slots=activeSlots(),T=target(),rec=recentIds(date);let best=null;
  const old=S.plan[date],keep={};
  if(old)for(const s of slots){if(((old.lock&&old.lock[s])||old.done[s]||(old.skip&&old.skip[s]))&&RB[old.m[s]])keep[s]=old.m[s];}
  for(let t=0;t<80;t++){
    const m={};let sum=0,pen=0;
    for(const s of slots){if(keep[s]){m[s]=keep[s];sum+=RB[keep[s]].k;continue;}const p=pool(s);if(!p.length)continue;const x=rnd(p);m[s]=x.id;sum+=x.k;if(rec.has(x.id))pen+=60;if(S.fav.includes(x.id))pen-=25;}
    const sc=Math.abs(sum-T)+pen+Math.random()*30;
    if(!best||sc<best.sc)best={m,sc};
  }
  const sub={},left={};Object.keys(keep).forEach(k=>{if(old.sub&&old.sub[k])sub[k]=old.sub[k];if(old.left&&old.left[k])left[k]=true;});
  const day={m:best.m,f:1,done:(old&&old.done)||{},ex:(old&&old.ex)||[],water:(old&&old.water)||0,lock:(old&&old.lock)||{},sub,left,skip:(old&&old.skip)||{},out:(old&&old.out)||{},free:old?old.free:false,freeK:old?old.freeK:0};
  calcF(day);S.plan[date]=day;return day;
}
function getDay(date){
  let d=S.plan[date];if(!d)d=genDay(date);
  let ch=false;
  for(const s of activeSlots()){if(!RB[d.m[s]]){const p=pool(s);if(p.length){d.m[s]=rnd(p).id;ch=true;}}}
  if(ch)calcF(d);return d;
}
function dayKcal(d){let k=0;for(const s of activeSlots()){if(d.done[s]&&RB[d.m[s]])k+=RB[d.m[s]].k*mf(d,s);}d.ex.forEach(e=>k+=+e.k||0);return Math.round(k);}
function dayProt(d){let p=0;for(const s of activeSlots()){if(d.done[s]&&RB[d.m[s]])p+=RB[d.m[s]].p*mf(d,s);}return Math.round(p);}
function daySoy(d){let n=0;for(const s of activeSlots()){if(d.done[s]&&RB[d.m[s]]&&RB[d.m[s]].soy)n++;}d.ex.forEach(e=>{if(e.soy)n++;});return n;}
function dayPlanK(d){return Math.round(activeSlots().reduce((a,s)=>a+(RB[d.m[s]]&&!(d.skip&&d.skip[s])?RB[d.m[s]].k*mf(d,s):0),0));}

function allocate(uses){

    const us=uses[n],sh=SHELF[n]||7,fr=FRZ.has(n),mn=Math.min(...us.map(u=>u.i)),mx=Math.max(...us.map(u=>u.i));

function weekScore(dates,fishOk){

  dates.forEach((dt,i)=>{const d=S.plan[dt];if(!d)return;pen+=Math.abs(d.f-1)*300;

function optimizeWeek(base,incToday){
  const dates=Array.from({length:7},(_,i)=>addD(base,i)),t=TODAY(),slots=activeSlots();
  dates.forEach(dt=>getDay(dt));
  const cands=[];dates.forEach(dt=>{if(dt<t||(dt===t&&!incToday))return;const d=S.plan[dt];slots.forEach(s=>{if((d.lock&&d.lock[s])||d.done[s]||(d.left&&d.left[s])||(d.skip&&d.skip[s]))return;cands.push([dt,s]);});});
  if(!cands.length)return;
  const PL={};slots.forEach(s=>PL[s]=pool(s));
  const fishOk=R.some(x=>!x.soy&&x.ing.split(',').some(i=>FISH.has(i.replace(/ \d+$/,''))));
  let curS=weekScore(dates,fishOk),best=curS,bestSt=snapState(dates);const N=2500;
  for(let it=0;it<N;it++){
    const temp=6*(1-it/N)+0.3,c=rnd(cands),dt=c[0],s=c[1],d=S.plan[dt];
    const oldM=d.m[s],oldSub=d.sub&&d.sub[s]?Object.assign({},d.sub[s]):null,oldF=d.f;
    if(Math.random()<0.7){const p=PL[s].filter(x=>x.id!==oldM);if(!p.length)continue;d.m[s]=rnd(p).id;if(d.sub)delete d.sub[s];}
    else{const x=RB[oldM];if(!x)continue;const gs=ingList(x,d,s).filter(g=>SUB[g.o]&&'MP'.includes((ING[g.o]||'X')[0]));if(!gs.length)continue;
      const g=rnd(gs),opts=SUB[g.o].filter(n=>!S.noing.includes(n)).concat([g.o]),pick=rnd(opts);
      d.sub=d.sub||{};d.sub[s]=d.sub[s]||{};if(pick===g.o)delete d.sub[s][g.o];else d.sub[s][g.o]=pick;}
    calcF(d);const sc=weekScore(dates,fishOk),dl=sc-curS;
    if(dl<=0||Math.random()<Math.exp(-dl/temp)){curS=sc;if(sc<best){best=sc;bestSt=snapState(dates);}}
    else{d.m[s]=oldM;if(oldSub)d.sub[s]=oldSub;else if(d.sub)delete d.sub[s];d.f=oldF;}
  }
  restoreState(bestSt);
}

  const tips=[];

  h+=report(per)+'</div>';h+=monthCard();
  return h;

function report(per){
  const t=TODAY();let rows='',nd=0,kc=0,wsum=0,wn=0,soy=0,eatenM=0,planM=0;
  for(let i=per-1;i>=0;i--){const dt=addD(t,-i),d=S.plan[dt];if(!d)continue;
    const sl=activeSlots(),eaten=sl.filter(s=>d.done[s]),k=dayKcal(d);
    if(!eaten.length&&!d.ex.length&&!d.water)continue;
    nd++;kc+=k;wsum+=d.water;wn++;soy+=daySoy(d);eatenM+=eaten.length;planM+=sl.length;
    const items=eaten.map(s=>`${d.done[s]} ${slotName(s).toLowerCase()}: ${esc(RB[d.m[s]].n.split(',')[0].replace(/\s*\(.*?\)/g,''))}`).concat(d.ex.map(e=>`navíc: ${esc(e.n)} (${e.k} kcal)`));
    rows+=`<tr><td>${fmt(dt)}</td><td>${items.join('<br>')}</td><td>${k}</td><td>${d.water}</td></tr>`;}
  const wts=S.wt.filter(w=>w.d>=addD(t,-per+1));
  let sum=`<p>${S.pf.name?'<b>'+esc(S.pf.name)+'</b>, ':''}období posledních ${per} dní. Denní cíl: <b>${target()} kcal</b>. `;
  if(nd)sum+=`Zapsaných dní: <b>${nd}</b>, průměr snězeno: <b>${Math.round(kc/nd)} kcal</b>, splněno jídel z plánu: <b>${Math.round(eatenM/planM*100)} %</b>, průměr pití: <b>${(wsum/wn).toFixed(1).replace('.',',')} sklenic</b>, jídel se sójou: <b>${soy}</b>. `;
  if(wts.length>1)sum+=`Váha: ${wts[0].w} kg &rarr; ${wts[wts.length-1].w} kg (${(wts[wts.length-1].w-wts[0].w>0?'+':'')+(wts[wts.length-1].w-wts[0].w).toFixed(1).replace('.',',')} kg). `;
  else if(wts.length===1)sum+=`Poslední váha: ${wts[0].w} kg. `;
  sum+='</p>';
  if(!rows)return sum+'<p class="muted">V tomto období zatím nejsou zapsaná žádná jídla. Na stránce Dnes klepněte na „Snědl/a jsem to“.</p>';
  return sum+`<table><tr><th>Den</th><th>Co jsem jedl/a (čas)</th><th>kcal</th><th>Sklenic</th></tr>${rows}</table>`;
}
function chart(W,goal){
  if(!W.length)return '<p class="muted">Zatím žádné zapsané váhy. Zapište první a objeví se graf.</p>';
  const w=600,h=220,p=38,vals=W.map(x=>x.w).concat(goal?[goal]:[]);let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const t0=parse(W[0].d).getTime(),t1=Math.max(parse(W[W.length-1].d).getTime(),t0+864e5*6);
  const X=d=>p+(parse(d).getTime()-t0)/(t1-t0)*(w-p-12),Y=v=>h-24-(v-mn)/(mx-mn)*(h-24-14);
  let s=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">`;
  for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4,y=Y(v);s+=`<line x1="${p}" x2="${w-6}" y1="${y}" y2="${y}" stroke="#e2e0d6"/><text x="4" y="${y+4}" font-size="11" fill="#6b7770">${v.toFixed(0)}</text>`;}
  if(goal)s+=`<line x1="${p}" x2="${w-6}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#b4541a" stroke-dasharray="5 4"/><text x="${w-90}" y="${Y(goal)-4}" font-size="11" fill="#b4541a">cíl ${goal} kg</text>`;
  s+=`<polyline fill="none" stroke="#2f7d4f" stroke-width="3" points="${W.map(x=>X(x.d)+','+Y(x.w)).join(' ')}"/>`;
  W.forEach(x=>s+=`<circle cx="${X(x.d)}" cy="${Y(x.w)}" r="4" fill="#2f7d4f"/>`);
  s+=`<text x="${p}" y="${h-6}" font-size="11" fill="#6b7770">${fmtS(W[0].d)}</text><text x="${w-50}" y="${h-6}" font-size="11" fill="#6b7770">${fmtS(W[W.length-1].d)}</text></svg>`;
  return s;
}

function price(n){return S.price&&S.price[n]!=null&&S.price[n]!==''?+S.price[n]:(PR[n]||0);}
function unitOf(n){return (ING[n]||'X').split('/')[1]||'g';}
function cost(n,q){return unitOf(n)==='ks'?price(n)*q:price(n)*q/1000;}
function pl(n){const p=price(n);if(!p)return '';const u=unitOf(n);return '~'+p+' Kč/'+(u==='ks'?'ks':u==='ml'?'l':'kg');}
function mealCost(x,d,s){return Math.round(ingList(x,d,s).reduce((a,i)=>a+cost(i.n,i.q*mf(d,s)),0));}
function dayCost(d){return activeSlots().reduce((a,s)=>a+(RB[d.m[s]]?mealCost(RB[d.m[s]],d,s):0),0);}
function parseIng(text){
  const out={};
  text.split(/[,;()]|\s+(?:a|s|se|na|ve|v|z)\s+|\s*\+\s*/).forEach(p0=>{
    const p=p0.split(/\s+nebo\s+/)[0].trim();if(!p)return;
    const kw=KW.find(k=>k[0].test(p));if(!kw)return;const n=kw[1],u=unitOf(n);let q=0;
    const m=p.match(/(\d+(?:[.,]\d+)?)\s*(kg|g|ml|dl|l|ks)(?![a-zěščřžýáíéúůďťň])/i);
    if(m){let v=parseFloat(m[1].replace(',','.'));const un=m[2].toLowerCase();if(un==='kg'||un==='l')v*=1000;if(un==='dl')v*=100;
      if(u==='ks')q=un==='ks'?v:(n==='Vejce'?Math.max(1,Math.round(v/60)):1);else if(un==='ks')q=v*(n==='Jablko'?150:100);else q=v;}
    else{const m2=p.match(/(\d+)\s*(?=vejc|vajíč|vajec|chlebíč)/i);if(m2)q=+m2[1];else if(/půl/i.test(p)&&u==='ks')q=0.5;}
    if(!q)q=u==='ks'?1:(n==='Bylinky'?5:({Z:80,O:80,M:100,D:50,P:50,L:20,X:5}[(ING[n]||'X')[0]]||50));
    out[n]=(out[n]||0)+q;});
  return out;
}
function nutOf(o){let k=0,p=0;for(const n in o){const v=NUT[n];if(!v)continue;const f=unitOf(n)==='ks'?o[n]:o[n]/100;k+=v[0]*f;p+=v[1]*f;}return {k:Math.round(k/5)*5,p:Math.round(p)};}
function ingStr(o){return Object.entries(o).map(([n,q])=>n+' '+Math.max(1,Math.round(q))).join(',');}
function chipsStr(str){return str.split(',').filter(Boolean).map(i=>{const m=i.match(/^(.*) (\d+)$/);if(!m)return '';const u=unitOf(m[1]);return `<span class="chip">${m[1]} ${m[2]} ${u}</span>`;}).join('');}

function toMin(t){const a=String(t||'0:0').split(':').map(Number);return a[0]*60+(a[1]||0);}
function alertsHtml(l){return l.length?`<div class="card"><h3>Hlídání</h3>${l.map(a=>`<div class="al ${a[0]}">${a[1]}</div>`).join('')}</div>`:'';}
function planAlerts(date,pre){
  const out=[],d=getDay(date),T=target(),pf=pre?fmt(date)+': ':'';
  const pp=Math.round(activeSlots().reduce((a,s)=>a+(RB[d.m[s]]?RB[d.m[s]].p:0),0)*d.f);
  if(pp<T*0.2/4)out.push(['w',`${pf}v plánu je jen ${pp} g bílkovin. Vyměňte některé jídlo za variantu s masem, vejci nebo tvarohem.`]);
  const kk=dayPlanK(d);if(kk>T*1.12)out.push(['w',`${pf}plán má ${kk} kcal, to je víc než cíl ${T}.`]);
  return out;
}
function weekAlerts(t){let all=[],c=0;for(let i=0;i<7;i++){const dt=addD(t,i);all=all.concat(planAlerts(dt,true));c+=dayCost(getDay(dt));}
  return `<p class="muted">Odhad ceny jídel na týden: <b>~${c} Kč</b> (ceny jsou orientační, upravíte je v Nastavení).</p>`+alertsHtml(all.slice(0,8));}
function dayAlerts(date){
  const out=planAlerts(date),t=TODAY(),d=getDay(date),T=dayTarget(d),k=dayKcal(d);
  if(date===t&&new Date().getDay()===1)out.push(['i','Je pondělí. V záložce Pokrok najdete týdenní hodnocení a návrh úpravy.']);
  if(date===t){
    const now=new Date(),nm=now.getHours()*60+now.getMinutes(),h=now.getHours();
    const times=activeSlots().filter(s=>d.done[s]).map(s=>toMin(d.done[s])).sort((a,b)=>a-b);
    const undone=activeSlots().filter(s=>!d.done[s]);
    if(h>=7&&h<21&&undone.length){if(times.length){const gap=nm-times[times.length-1];if(gap>180)out.push(['i',`Od posledního zapsaného jídla uplynuly ${Math.floor(gap/60)} hodiny. Pauzy by neměly být delší než 3 hodiny, je čas na další jídlo.`]);}else if(nm>10*60)out.push(['i','Dnes zatím nemáte zapsané žádné jídlo. Pravidelné jídlo je základ.']);}
    const exp=Math.round(waterGoal()*clamp((nm-8*60)/(12*60),0,1));
    if(h>=11&&d.water<exp-1)out.push(['i',`Pití: máte ${d.water} sklenic, v tuto dobu by mělo být asi ${exp}. Napijte se dřív, než dostanete žízeň.`]);
    if(times.length&&times[times.length-1]>toMin(S.set.bed||'22:00')-120)out.push(['w','Poslední jídlo dne má být 2 až 3 hodiny před spaním. Dnes jste jedl/a později.']);
    const lw=S.wt.length?S.wt[S.wt.length-1]:null;
    if(!lw||(parse(t)-parse(lw.d))/864e5>7)out.push(['i','Dlouho jste se nevážil/a. Zapište váhu, ať je vidět pokrok.']);
    if(lw){const b=[...S.wt].reverse().find(x=>x.d<=addD(lw.d,-7)&&x.d>=addD(lw.d,-28));if(b){const rate=(lw.w-b.w)/((parse(lw.d)-parse(b.d))/6048e5);if(rate<-1)out.push(['w',`Hubnete rychleji než 1 kg týdně (${rate.toFixed(1).replace('.',',')} kg). Příliš rychlé hubnutí není dobré, poraďte se s výživovým specialistou.`]);}}
    let over=0;for(let i=1;i<=3;i++){const pd=S.plan[addD(t,-i)];if(pd&&pd.ex.concat(Object.keys(pd.done)).length&&dayKcal(pd)>T*1.1&&!pd.free)over++;}
    if(over===3)out.push(['i','Už třetí den po sobě jste nad cílem. Zkuste dnes lehčí jídla se zeleninou a bílkovinou, nic si nevyčítejte.']);
  }
  if(k>T*1.1)out.push(['w',`Dnes jste nad cílem o ${k-T} kcal. Nic si nevyčítejte, další jídlo vezměte lehčí (zelenina a bílkovina).`]);
  const sw=weekSoy(date);if(sw)out.push(['i',`V posledních 7 dnech: ${sw} jídel se sójou.`]);
  return out;
}

let IMP=[];
async function docxText(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;
  while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl));
    if(name==='word/document.xml'){
      const st=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true),data=u.subarray(st,st+cs);let xml;
      if(method===0)xml=new TextDecoder().decode(data);
      else{const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(data);w.close();xml=await new Response(ds.readable).text();}
      return xml.split('</w:p>').map(par=>par.replace(/<w:tab\/>/g,' ').replace(/<w:br\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").trim());
    }
    p+=46+nl+el+cl;
  }
  throw new Error('nodoc');
}

function applyPantry(uses,base){

  Object.keys(uses).forEach(n=>{
    const pe=S.pantry&&S.pantry[n],us=uses[n].slice().sort((a,b)=>a.i-b.i);

    const exp=addD(pe.d,shelfOf(n)),from=pe.a||pe.d;let avail=pe.q;const res=[];

    case 'pantrydone':{const t=addD(TODAY(),7*wo);if(S.pantryDone&&S.pantryDone[t])return alert('Zbytky z tohoto týdne už jsou uložené.');const sel=S.shop.days||[0,1,2,3,4,5,6],SD=shopData(t,sel),np={},names=new Set(Object.keys(S.pantry||{}));SD.al.forEach(b=>names.add(b.n));
      names.forEach(n=>{const e=S.pantry[n],pq=e?e.q:0,used=SD.cons[n]||0;let bs=0,ns=0;SD.al.filter(b=>b.n===n).forEach(b=>{bs+=b.bought;ns+=b.q;});const left=pq-used+bs-ns;if(left>=(unitOf(n)==='ks'?1:30))np[n]={q:Math.round(left*10)/10,d:bs>ns?TODAY():(e?e.d:TODAY()),a:bs>ns?addD(t,7):(e&&e.a)||TODAY()};});
      S.pantry=np;S.pantryDone=S.pantryDone||{};S.pantryDone[t]=1;render();alert('Uloženo položek doma: '+Object.keys(np).length+'. Při příštím nákupu se odečtou a aplikace je přednostně použije.');break;}
    case 'fridge':S.fq=$('#fq').value;render();break;
    case 'fridgep':S.fq=Object.keys(S.pantry||{}).filter(n=>S.pantry[n].q>0).join(', ');render();break;
    case 'puttoday':{const x=RB[v];if(!x)break;if(!activeSlots().includes(x.s))return alert('Tohle jídlo patří do části dne, kterou máte vypnutou (zapnete v Nastavení).');const d=getDay(TODAY());d.m[x.s]=v;if(d.sub)delete d.sub[x.s];calcF(d);cur=TODAY();tab='dnes';render();window.scrollTo(0,0);break;}
    case 'adj':{const fl=S.pf.sex==='m'?1500:1200,nt=clamp(target()+ +v,fl,3500);if(nt===target()&&+v<0)return alert('Níž už nejdu, kvůli zdraví je to spodní hranice.');S.pf.kcal=nt;const t0=TODAY();for(let i=1;i<30;i++){const dt=addD(t0,i),pd=S.plan[dt];if(pd&&!Object.keys(pd.done).length&&!Object.keys(pd.skip||{}).length&&!Object.values(pd.lock||{}).some(Boolean))delete S.plan[dt];}render();alert('Nový denní cíl: '+nt+' kcal. Dny, které ještě nezačaly, se přepočítají.');break;}
    case 'cook2':{const d=getDay(cur),nd=getDay(addD(cur,1));nd.m[v]=d.m[v];nd.sub=nd.sub||{};if(d.sub&&d.sub[v])nd.sub[v]=Object.assign({},d.sub[v]);else delete nd.sub[v];nd.lock=nd.lock||{};nd.lock[v]=true;nd.left=nd.left||{};nd.left[v]=true;calcF(nd);d.lock=d.lock||{};d.lock[v]=true;render();alert('Hotovo. Uvařte dvojitou porci, zítra v '+slotName(v).toLowerCase()+' máte stejné jídlo a stačí ho ohřát.');break;}
    case 'impm':impModal();break;
    case 'impgo':impParse($('#impt').value.split(/\r?\n/));break;
    case 'impsave':{let c=0;IMP.filter(x=>x.on).forEach(x=>{newCustom({s:x.s,n:x.n,k:+x.k||0,p:+x.p||0,ing:x.ing,soy:x.soy});c++;});closeM();render();alert('Přidáno jídel: '+c+'. Najdete je v záložce Recepty a budou se zařazovat do jídelníčku.');break;}
    case 'customm':customModal();break;
    case 'customsave':{const n=$('#cnm').value.trim();if(!n)return alert('Napište název jídla.');const o=parseIng($('#ci').value.trim()||n),nu=nutOf(o),k=+$('#ck').value||nu.k;if(!k)return alert('Nepodařilo se odhadnout kalorie. Doplňte je ručně.');newCustom({s:$('#cs').value,n,k,p:+$('#cp').value||nu.p,ing:ingStr(o),soy:$('#csoy').checked||/sój|sojov|tofu|tempeh|miso/i.test(n)?1:0});closeM();render();break;}
    case 'delcustom':if(confirm('Smazat tento vlastní recept?')){const i=R.findIndex(x=>x.id===v);if(i>=0)R.splice(i,1);delete RB[v];S.custom=S.custom.filter(x=>x.id!==v);S.fav=S.fav.filter(x=>x!==v);render();}break;
    case 'notif':{if(!('Notification' in window))return alert('Tento prohlížeč upozornění nepodporuje.');Notification.requestPermission().then(r=>alert(r==='granted'?'Upozornění povolena.':'Upozornění nejsou povolena, připomínky se budou ukazovat jen uvnitř aplikace.'));break;}
    case 'shopshare':{let tx='Nákup\n';document.querySelectorAll('.shop h3, .shop h4, .shop li').forEach(el=>{tx+=el.tagName==='H3'?'\n== '+el.innerText+' ==\n':el.tagName==='H4'?'\n'+el.innerText+'\n':'- '+el.querySelector('label').innerText.trim()+'\n';});if(navigator.share){navigator.share({title:'Nákup',text:tx}).catch(()=>{});}else if(navigator.clipboard){navigator.clipboard.writeText(tx).then(()=>alert('Seznam je zkopírovaný, vložte ho třeba do zprávy.'));}break;}
    case 'rndswap':{const d=getDay(cur);const p=pool(v).filter(x=>x.id!==d.m[v]);if(p.length){d.m[v]=rnd(p).id;if(d.sub)delete d.sub[v];calcF(d);}closeM();render();break;}
    case 'setmeal':{const d=getDay(cur);d.m[t.dataset.s]=v;if(d.sub)delete d.sub[t.dataset.s];calcF(d);closeM();render();break;}
    case 'addex':{const n=$('#exn').value.trim(),k=+$('#exk').value;if(!n)return alert('Napište, co to bylo.');getDay(cur).ex.push({n,k:k||0,soy:$('#exs').checked});render();break;}
    case 'delex':getDay(cur).ex.splice(+v,1);render();break;
    case 'qwt':{const w=+$('#qw').value;if(!w)return alert('Napište váhu v kg.');putW(cur,w);render();break;}
    case 'regen':genDay(cur);render();break;
    case 'regenday':genDay(v);render();break;
    case 'regenweek':if(confirm('Vymyslet týden znovu a chytře sloučit nákup? Zamknutá a už snědená jídla zůstanou.')){const b=addD(TODAY(),7*wo);for(let i=0;i<7;i++)genDay(addD(b,i));optimizeWeek(b,true);S.smart[b]=1;render();}break;
    case 'regenall':{const t0=TODAY();for(let i=0;i<30;i++){const dt=addD(t0,i);if(S.plan[dt]&&!Object.keys(S.plan[dt].done).length)delete S.plan[dt];}render();alert('Hotovo, další dny se vymyslí podle nového nastavení.');break;}
    case 'fav':S.ban=S.ban.filter(x=>x!==v);S.fav=S.fav.includes(v)?S.fav.filter(x=>x!==v):S.fav.concat(v);render();break;
    case 'ban':S.fav=S.fav.filter(x=>x!==v);S.ban=S.ban.includes(v)?S.ban.filter(x=>x!==v):S.ban.concat(v);render();break;
    case 'addw':{const w=+$('#ww').value,c=+$('#wc').value,d=$('#wd').value;if(!w||!d)return alert('Vyplňte datum a váhu.');putW(d,w,c);render();break;}
    case 'print':window.print();break;
    case 'shopreset':S.shop.ck={};render();break;
    case 'export':{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='jidelnicek-zaloha-'+TODAY()+'.json';l.click();break;}
    case 'wipe':if(confirm('Opravdu smazat všechna data (váhy, zápisy, nastavení)?')&&confirm('Je to nevratné. Smazat?')){localStorage.removeItem(KEY);location.reload();}break;
  }
});
function putW(d,w,c){S.wt=S.wt.filter(x=>x.d!==d);S.wt.push({d,w,c:c||0});S.wt.sort((a,b)=>a.d<b.d?-1:1);}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.imp){impEdit(t);return;}
  if(t.dataset.p){S.price[t.dataset.p]=+t.value;save();return;}
  if(t.dataset.a==='rmon'){S.rm=+t.value;render();return;}
  if(t.id==='impf'){impFile(t.files[0]);return;}
  if(t.dataset.f){const pa=t.dataset.f.split('.'),g=pa[0],k=pa[1];let val=t.type==='checkbox'?t.checked:t.value;if(pa.length===3)S[g][k][pa[2]]=val;else S[g][k]=val;if(g==='pf'&&k==='w'&&val&&!S.wt.length)putW(TODAY(),+val);
    if(pa.length===3||k==='bed'){save();return;}
    if(t.type==='radio'||t.tagName==='SELECT'||t.type==='checkbox'||k==='kcal'||g==='pf'){render();}else save();return;}
  if(t.dataset.a==='rfs'){S.rf=Object.assign(S.rf||{q:''},{s:t.value});render();}
  if(t.dataset.a==='rper'){S.rp=+t.value;render();}
  if(t.id==='imp'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const j=JSON.parse(rd.result);S=Object.assign(defaults(),j);save();alert('Záloha obnovena.');location.reload();}catch(er){alert('Soubor se nepodařilo načíst.');}};rd.readAsText(f);}
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a==='rfq'){S.rf=Object.assign(S.rf||{s:'all'},{q:t.value});const pos=t.selectionStart;render();const n=$('#rq');n.focus();n.setSelectionRange(pos,pos);}
  else if(t.dataset.f&&t.type!=='radio'&&t.type!=='checkbox'&&t.tagName!=='SELECT'){const pa=t.dataset.f.split('.');if(pa.length===3)S[pa[0]][pa[1]][pa[2]]=t.value;else S[pa[0]][pa[1]]=t.value;save();}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM();});
render();
setInterval(remCheck,30000);setTimeout(remCheck,1500);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
